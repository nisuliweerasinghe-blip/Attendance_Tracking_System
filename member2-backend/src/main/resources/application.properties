server.port=4001

# H2 file database (created automatically in ./data)
spring.datasource.url=jdbc:h2:file:./data/smartattend
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

smartattend.jwt.secret=change-me-change-me-change-me-change-me-1234
smartattend.jwt.expires-hours=8
smartattend.cors.origin=*

# Rate limits (raise temporarily for load tests, e.g. auth-max=1000, attendance-max=30)
smartattend.rate.auth-max=50
smartattend.rate.attendance-max=10

# Optional: Member 1's Node/Socket.IO service URL. Every event is POSTed there as JSON.
# Example: smartattend.webhook-url=http://localhost:5000/internal/events
smartattend.webhook-url=

# Creates lecturer@test.com / admin@test.com and prints a fresh session code on startup
smartattend.demo-seed=true
